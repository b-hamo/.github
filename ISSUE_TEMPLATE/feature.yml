name: 기능 개발
description: 새로운 기능 개발을 위한 Issue입니다.
title: "[FEAT] "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 어떤 기능을 구현할지 작성해주세요.
      placeholder: |
        예)
        Artifact Broker에서 파일 업로드 기능을 구현한다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      description: 구현해야 할 작업을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 업로드 API 구현
        - [ ] 파일 크기 검사
        - [ ] 오류 처리
    validations:
      required: true

  - type: textarea
    id: test
    attributes:
      label: 완료 조건
      description: 어떤 상태가 되면 이 작업이 완료된 것인지 작성해주세요.
      placeholder: |
        예)
        - 정상 파일 업로드 성공
        - 크기 초과 파일 차단 확인
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 참고 사항
      description: 관련 Issue, 문서 또는 참고할 내용을 작성해주세요.
