name: 버그
description: 오류나 예상과 다른 동작을 보고합니다.
title: "[FIX] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 문제 내용
      description: 어떤 문제가 발생했는지 작성해주세요.
      placeholder: |
        예)
        Sandbox 종료 후 Runner 프로세스가 종료되지 않는다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 문제가 발생하는 순서를 작성해주세요.
      placeholder: |
        1. Sandbox 실행
        2. Runner 연결
        3. Sandbox 종료
        4. Runner 프로세스 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      placeholder: |
        예)
        Sandbox 종료 시 Runner 프로세스도 함께 종료되어야 한다.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 로그, 스크린샷, 관련 Issue 등이 있다면 작성해주세요.
